<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>학급 게시판</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app" class="app">

  <header class="header">
    <div>
      <div class="eyebrow">CLASS BOARD</div>
      <div class="title" id="classNameLabel">우리 학급</div>
    </div>
    <div class="role-switch">
      <button class="role-btn active" data-role="student">학생</button>
      <button class="role-btn" data-role="teacher">선생님</button>
    </div>
  </header>

  <!-- 선생님 잠금 화면 -->
  <div id="lockScreen" class="lock-wrap hidden">
    <div class="lock-card">
      <div class="lock-emoji">🔒</div>
      <div class="lock-title">선생님 인증</div>
      <div class="lock-sub">비밀번호를 입력해주세요</div>
      <input id="passInput" class="input" type="password" placeholder="비밀번호" />
      <div id="passError" class="error-text"></div>
      <button id="unlockBtn" class="btn primary full">입장하기</button>
      <div class="hint" style="margin-top:14px;">기본 비밀번호: 1234 (설정 탭에서 변경)</div>
    </div>
  </div>

  <!-- 메인 -->
  <div id="mainArea" class="hidden">
    <div class="tabs">
      <button class="tab-btn active" data-tab="board">📌 게시판</button>
      <button class="tab-btn" data-tab="meal">🍚 급식표</button>
      <button class="tab-btn teacher-only hidden" data-tab="settings">⚙️ 설정</button>
    </div>

    <div class="content">

      <!-- 게시판 -->
      <div id="tab-board" class="tab-panel">
        <button id="newPostBtn" class="btn primary teacher-only hidden">+ 새 글 작성</button>

        <div id="editCard" class="edit-card hidden">
          <input id="postTitleInput" class="input" placeholder="제목" />
          <textarea id="postContentInput" class="input textarea" placeholder="내용을 입력하세요"></textarea>
          <div class="row gap">
            <button id="savePostBtn" class="btn primary">저장</button>
            <button id="cancelPostBtn" class="btn ghost">취소</button>
          </div>
        </div>

        <div id="postList" class="post-list"></div>
      </div>

      <!-- 급식표 -->
      <div id="tab-meal" class="tab-panel hidden">
        <div class="date-nav">
          <button id="prevDayBtn" class="link-btn">← 어제</button>
          <div id="dateLabel" class="date-label"></div>
          <button id="nextDayBtn" class="link-btn">내일 →</button>
        </div>
        <button id="todayBtn" class="btn ghost" style="margin-top:8px;">오늘로 이동</button>
        <div id="mealArea" style="margin-top:16px;"></div>
      </div>

      <!-- 설정 (선생님) -->
      <div id="tab-settings" class="tab-panel hidden">
        <div class="section-label">학급 이름</div>
        <input id="classNameInput" class="input" />

        <div class="section-label" style="margin-top:20px;">교육청코드 / 표준학교코드</div>
        <div class="hint">GitHub 저장소의 .github/workflows/update-meal.yml 안의 코드를 바꾸면 다른 학교로도 쓸 수 있어요.</div>
        <div class="row gap" style="margin-top:8px;">
          <input id="officeCodeLabel" class="input" disabled />
          <input id="schoolCodeLabel" class="input" disabled />
        </div>

        <div class="section-label" style="margin-top:20px;">선생님 비밀번호 변경</div>
        <input id="passcodeInput" class="input" placeholder="새 비밀번호" />

        <button id="saveSettingsBtn" class="btn primary" style="margin-top:20px;">설정 저장</button>
      </div>

    </div>
  </div>
</div>

<!-- Firebase SDK (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
